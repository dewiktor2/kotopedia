name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_NATIVE_FILE_CACHE: 'true'
      NX_DAEMON: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-fund --no-audit --loglevel=error

      - name: Verify node_modules integrity
        run: |
          echo "=== jest-preset-angular from root ==="
          node -e "console.log(require.resolve('jest-preset-angular'))"
          echo "=== jest-preset-angular from rootDir ==="
          node -e "console.log(require.resolve('jest-preset-angular', { paths: [process.cwd() + '/apps/baza-karm'] }))"
          echo "=== ts-jest ==="
          node -e "console.log(require.resolve('ts-jest'))"
          echo "=== unrs Linux resolver binding ==="
          node -e "console.log(require.resolve('@unrs/resolver-binding-linux-x64-gnu'))"

      - name: Test
        run: npx nx run baza-karm:test

      - name: Build Nx app
        run: npx nx run baza-karm:build:ci
