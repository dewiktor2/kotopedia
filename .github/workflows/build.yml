name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_NATIVE_FILE_CACHE: 'true'
      NX_DAEMON: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-fund --no-audit --loglevel=error

      - name: Force install Linux native bindings (npm bug workaround)
        run: npm install @esbuild/linux-x64@0.28.1 @swc/core-linux-x64-gnu@1.15.8 @nx/nx-linux-x64-gnu@23.1.1 --no-save

      - name: Debug Jest Preset Angular
        run: node -e "try { require('jest-preset-angular/build/index.js'); console.log('jest-preset-angular loaded successfully'); } catch(e) { console.error('jest-preset-angular failed to load:', e); process.exit(1); }"

      - name: Test
        run: npx nx run baza-karm:test

      - name: Build Nx app
        run: npx nx run baza-karm:build:ci
