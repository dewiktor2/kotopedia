name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_NATIVE_FILE_CACHE: 'true'
      NX_DAEMON: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --loglevel=error

      - name: Test
        run: npx nx run baza-karm:test

      - name: Build Nx app
        run: npx nx run baza-karm:build:ci
